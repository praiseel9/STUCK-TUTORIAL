        <section>
            <h2>What is a Stock?</h2>
            <p>A stock is a share of ownership in a company. When you buy stock, you become a partial owner of that business!</p>
        </section>
        <section>
            <h2>Why do prices change?</h2>
            <p>Prices change based on supply and demand. If more people want to buy a stock, the price goes up.</p>
        </section>
